<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Do‘kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f3f7;--card:#fff;--ink:#17171c;--mute:#7d7d8c;--line:#e6e6ee;--pri:#7000ff;--pri2:#5b00d1;--soft:#efe5ff;--red:#ef2d4a;--yel:#ffc400}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f14;--card:#1a1a22;--ink:#f2f2f7;--mute:#9a9aab;--line:#2a2a35;--soft:#2a1b4d;--pri:#9a4dff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--pri);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;border:1px solid var(--line)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.banner{margin:0 12px 4px;border-radius:14px;padding:18px;color:#fff;background:linear-gradient(120deg,#7000ff,#c04dff);display:flex;justify-content:space-between;align-items:center}
.banner b{font-size:20px;display:block}
.banner span{font-size:44px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:820px){.grid{grid-template-columns:repeat(5,1fr)}}
.p{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:64px}
.badge{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px}
.pb{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.rt{font-size:12px;color:var(--mute)}
.old{font-size:12px;color:var(--mute);text-decoration:line-through;min-height:16px}
.pr{font-weight:800;font-size:16px}
.add{margin-top:6px;background:var(--soft);color:var(--pri);border-radius:8px;padding:8px;font-weight:700}
.qty{margin-top:6px;display:flex;align-items:center;justify-content:space-between;background:var(--pri);color:#fff;border-radius:8px}
.qty button{background:none;color:#fff;font-size:20px;width:40px;height:34px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;padding:9px 0 8px;color:var(--mute);font-size:12px;position:relative}
.nav button.on{color:var(--pri);font-weight:700}
.nav i{display:block;font-style:normal;font-size:22px}
.cnt{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.ci{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:10px;margin:10px 12px;align-items:center}
.ci .th{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-size:34px;flex:none}
.ci .in{flex:1;min-width:0}
.ci .qty{background:var(--soft);color:var(--pri);margin:0}
.ci .qty button{color:var(--pri)}
.box{background:var(--card);border-radius:12px;padding:14px;margin:10px 12px}
.box label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.box input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
.row{display:flex;justify-content:space-between;padding:3px 0}
.go{display:block;width:calc(100% - 24px);margin:6px 12px;background:var(--pri);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:16px}
.sheet{position:fixed;inset:0;z-index:30;background:#0007;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sh{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.sh .pic{aspect-ratio:16/10;font-size:96px}
.sh .bd{padding:14px}
.sh h2{margin:0 0 6px;font-size:18px}
.close{position:absolute;right:10px;top:10px;background:#0006;color:#fff;border-radius:50%;width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17171c;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;display:none;font-size:14px}
.fav{position:absolute;right:8px;top:8px;background:#fffa;border-radius:50%;width:32px;height:32px;font-size:16px;z-index:1}
.sort{margin:0 12px;display:flex;justify-content:flex-end}
.sort select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px}
.opts{display:flex;gap:8px;margin:6px 0 10px}
.opt{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:13px}
.opt.on{border-color:var(--pri);background:var(--soft);color:var(--pri);font-weight:700}
.pm{display:flex;gap:8px}.pm input{flex:1}.pm button{background:var(--pri);color:#fff;border-radius:8px;padding:0 14px}
</style>
</head>
<body>
<div class="top"><div class="search"><span>🔍</span><input id="q" placeholder="Mahsulotlarni qidirish" type="search"></div></div>
<div id="view"></div>
<nav class="nav">
  <button data-t="home" class="on"><i>🏠</i>Asosiy</button>
  <button data-t="fav"><i>❤️</i>Sevimli</button>
  <button data-t="orders"><i>📦</i>Buyurtmalar</button>
  <button data-t="cart"><i>🛒</i>Savat<span class="cnt" id="cnt" hidden>0</span></button>
</nav>
<div class="sheet" id="sheet"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand()}catch(e){}}

  // ---- Mahsulotlar: shu ro‘yxatni o‘zingizning tovarlaringizga almashtiring ----
  var CATS=['Hammasi','Elektronika','Kiyim','Uy-ro‘zg‘or','Go‘zallik','Oziq-ovqat'];
  var P=[
    {id:1,n:'Smartfon 128 GB, qora',c:'Elektronika',p:2890000,o:3490000,r:4.8,v:312,e:'📱',bg:'#e7efff',d:'6,5 dyuymli ekran, 50 MP kamera, 5000 mAh batareya.'},
    {id:2,n:'Simsiz quloqchin',c:'Elektronika',p:289000,o:449000,r:4.6,v:1204,e:'🎧',bg:'#ffe9f0',d:'Shovqinni bostirish, 24 soatgacha ishlaydi.'},
    {id:3,n:'Aqlli soat, qora tasma',c:'Elektronika',p:549000,o:null,r:4.5,v:87,e:'⌚',bg:'#e9fff4',d:'Qadamlarni va uyquni kuzatadi, suv o‘tkazmaydi.'},
    {id:4,n:'Erkaklar kurtkasi, qishki',c:'Kiyim',p:459000,o:699000,r:4.7,v:540,e:'🧥',bg:'#fff3e0',d:'Issiq astar, shamoldan himoya qiladi.'},
    {id:5,n:'Krossovkalar, yengil',c:'Kiyim',p:319000,o:null,r:4.4,v:230,e:'👟',bg:'#f0e9ff',d:'Kundalik yurish va sport uchun.'},
    {id:6,n:'Paxta ko‘rpa-yostiq to‘plami',c:'Uy-ro‘zg‘or',p:389000,o:520000,r:4.9,v:98,e:'🛏️',bg:'#e7f6ff',d:'Ikki kishilik, 100% paxta.'},
    {id:7,n:'Elektr choynak 1,7 L',c:'Uy-ro‘zg‘or',p:149000,o:199000,r:4.6,v:760,e:'🫖',bg:'#fff0e7',d:'Zanglamaydigan po‘latdan, avtomatik o‘chadi.'},
    {id:8,n:'Yuz uchun namlovchi krem',c:'Go‘zallik',p:79000,o:null,r:4.5,v:415,e:'🧴',bg:'#ffeaf6',d:'Quruq teri uchun, 50 ml.'},
    {id:9,n:'Atir, 50 ml',c:'Go‘zallik',p:249000,o:329000,r:4.7,v:162,e:'🌸',bg:'#f3e9ff',d:'Gulli va yengil hid.'},
    {id:10,n:'Tabiiy asal, 1 kg',c:'Oziq-ovqat',p:99000,o:null,r:4.9,v:890,e:'🍯',bg:'#fff7d6',d:'Tog‘ asalarilaridan, qo‘shimchalarsiz.'},
    {id:11,n:'Yong‘oq aralashmasi, 500 g',c:'Oziq-ovqat',p:69000,o:89000,r:4.6,v:301,e:'🥜',bg:'#ffeede',d:'Bodom, yong‘oq va mayiz.'},
    {id:12,n:'Noutbuk 15,6", 8/256 GB',c:'Elektronika',p:5490000,o:6290000,r:4.7,v:64,e:'💻',bg:'#e8eefc',d:'Ofis va o‘qish uchun, yengil korpus.'}
  ];

  var KEY='dokon-savat-v1',cart={},cat='Hammasi',q='',tab='home';
  var KEY2='dokon-yana-v1',sortBy='def',promo='',deliv='courier',pay='cash';
  var S={fav:{},orders:[],prof:{}},PROMOS={CHEGIRMA10:{p:10},YANGI50:{s:50000}};
  try{cart=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){cart={}}
  try{var s0=JSON.parse(localStorage.getItem(KEY2)||'null');if(s0)S=s0}catch(e){}
  function save2(){try{localStorage.setItem(KEY2,JSON.stringify(S))}catch(e){}}
  try{var u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&!S.prof.name)S.prof.name=u.first_name||''}catch(e){}
  var $=function(i){return document.getElementById(i)},view=$('view');
  var money=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so‘m'};
  var byId=function(id){return P.filter(function(x){return x.id==id})[0]};
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
  function count(){return Object.keys(cart).reduce(function(s,k){return s+cart[k]},0)}
  function total(){return Object.keys(cart).reduce(function(s,k){return s+cart[k]*byId(k).p},0)}
  function toast(t){var x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){x.style.display='none'},1800)}
  function qtyHtml(id){
    var n=cart[id]||0;
    return n?'<div class="qty"><button data-a="dec" data-id="'+id+'" aria-label="Kamaytirish">−</button><b>'+n+'</b><button data-a="inc" data-id="'+id+'" aria-label="Ko‘paytirish">+</button></div>'
            :'<button class="add" data-a="inc" data-id="'+id+'">Savatga</button>';
  }
  function card(x){
    var off=x.o?Math.round((1-x.p/x.o)*100):0;
    return '<div class="p" data-open="'+x.id+'"><button class="fav" data-a="fav" data-id="'+x.id+'" aria-label="Sevimli">'+(S.fav[x.id]?'❤️':'🤍')+'</button><div class="pic" style="background:'+x.bg+'">'+x.e+'</div>'+(off?'<span class="badge">−'+off+'%</span>':'')+
      '<div class="pb"><div class="nm">'+x.n+'</div><div class="rt">⭐ '+x.r+' · '+x.v+' ta sharh</div>'+
      '<div class="old">'+(x.o?money(x.o):'')+'</div><div class="pr">'+money(x.p)+'</div><div data-q="'+x.id+'">'+qtyHtml(x.id)+'</div></div></div>';
  }
  function home(){
    var list=P.filter(function(x){return (cat==='Hammasi'||x.c===cat)&&x.n.toLowerCase().indexOf(q.toLowerCase())>-1});
    if(sortBy==='asc')list.sort(function(a,b){return a.p-b.p});else if(sortBy==='desc')list.sort(function(a,b){return b.p-a.p});else if(sortBy==='rate')list.sort(function(a,b){return b.r-a.r});
    view.innerHTML='<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join('')+'</div>'+
      (q||cat!=='Hammasi'?'':'<div class="banner"><div><b>Chegirmalar haftasi</b>70% gacha tushirilgan narxlar</div><span>🎁</span></div>')+
      '<div class="sort"><select id="sort" aria-label="Saralash"><option value="def">Tavsiya etilgan</option><option value="asc">Arzonroq</option><option value="desc">Qimmatroq</option><option value="rate">Reyting bo‘yicha</option></select></div>'+(list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty"><b>Hech narsa topilmadi</b>Boshqa so‘z bilan qidirib ko‘ring.</div>');
    $('sort').value=sortBy;
  }
  function esc(t){return String(t||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function calc(){var sub=total(),p=PROMOS[promo],d=p?(p.p?Math.round(sub*p.p/100):Math.min(p.s,sub)):0,dl=deliv==='pickup'?0:((sub-d)>=200000?0:15000);return {sub:sub,disc:d,dl:dl,sum:sub-d+dl}}
  function opt(a,v,on,t){return '<button class="opt'+(on?' on':'')+'" data-a="'+a+'" data-v="'+v+'">'+t+'</button>'}
  function cartView(){
    var ids=Object.keys(cart);
    if(!ids.length){view.innerHTML='<div class="empty"><b>Savat bo‘sh</b>Mahsulotlarni tanlab, savatga qo‘shing.</div>';return}
    var c=calc(),pf=S.prof;
    view.innerHTML=ids.map(function(id){var x=byId(id);
      return '<div class="ci"><div class="th" style="background:'+x.bg+'">'+x.e+'</div><div class="in"><div class="nm" style="min-height:0">'+x.n+'</div><div class="pr">'+money(x.p*cart[id])+'</div></div><div style="width:110px">'+qtyHtml(id)+'</div></div>'}).join('')+
      '<div class="box"><b>Promokod</b><div class="pm" style="margin-top:6px"><input id="pc" placeholder="Masalan: CHEGIRMA10" value="'+esc(promo)+'"><button data-a="promo">Qo‘llash</button></div></div>'+
      '<div class="box"><b>Yetkazib berish</b><div class="opts">'+opt('deliv','courier',deliv==='courier','🚚 Kuryer')+opt('deliv','pickup',deliv==='pickup','🏬 Olib ketish')+'</div>'+
      '<b>To‘lov usuli</b><div class="opts">'+opt('pay','cash',pay==='cash','💵 Naqd')+opt('pay','card',pay==='card','💳 Karta (qabul qilganda)')+'</div></div>'+
      '<div class="box"><label for="nm2">Ismingiz</label><input id="nm2" autocomplete="name" value="'+esc(pf.name)+'">'+
      '<label for="ph">Telefon raqami</label><input id="ph" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel" value="'+esc(pf.phone)+'">'+
      (deliv==='courier'?'<label for="ad">Manzil</label><input id="ad" autocomplete="street-address" value="'+esc(pf.address)+'">':'')+'</div>'+
      '<div class="box"><div class="row"><span>Mahsulotlar ('+count()+')</span><span>'+money(c.sub)+'</span></div>'+
      (c.disc?'<div class="row"><span>Chegirma</span><span>−'+money(c.disc)+'</span></div>':'')+
      '<div class="row"><span>Yetkazib berish</span><span>'+(c.dl?money(c.dl):'Bepul')+'</span></div>'+
      (deliv==='courier'&&c.dl?'<div class="rt">200 000 so‘mdan yuqori buyurtmada yetkazib berish bepul</div>':'')+
      '<div class="row"><b>Jami</b><b>'+money(c.sum)+'</b></div></div>'+
      '<button class="go" data-a="order">Buyurtma berish</button>';
  }
  function favView(){var l=P.filter(function(x){return S.fav[x.id]});view.innerHTML=l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<div class="empty"><b>Sevimlilar yo‘q</b>Mahsulotdagi 🤍 belgisini bosing.</div>'}
  function ordersView(){
    if(!S.orders.length){view.innerHTML='<div class="empty"><b>Buyurtmalar yo‘q</b>Birinchi buyurtmangizni bering.</div>';return}
    view.innerHTML=S.orders.map(function(o){return '<div class="box"><div class="row"><b>Buyurtma №'+String(o.id).slice(-5)+'</b><span style="color:#16a34a;font-weight:700">'+o.status+'</span></div>'+
      '<div class="rt">'+o.date+' · '+(o.deliv==='pickup'?'Olib ketish':'Kuryer')+' · '+(o.pay==='card'?'Karta':'Naqd')+'</div>'+
      '<div style="margin:6px 0">'+o.items.map(function(i){return i.name+' × '+i.qty}).join(', ')+'</div>'+
      '<div class="row"><b>'+money(o.total)+'</b><button class="chip" data-a="repeat" data-id="'+o.id+'">Qayta buyurtma</button></div></div>'}).join('');
  }
  function draw(){
    if(tab==='home')home();else if(tab==='fav')favView();else if(tab==='orders')ordersView();else cartView();
    var n=count(),c=$('cnt');c.hidden=!n;c.textContent=n;
    document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
    document.querySelector('.top').style.display=tab==='home'?'block':'none';
  }
  function redraw(){var y=window.scrollY;draw();window.scrollTo(0,y)}
  function change(id,d){
    cart[id]=(cart[id]||0)+d; if(d>0&&tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light')}catch(e){}} if(cart[id]<=0)delete cart[id];
    persist();
    if(tab==='cart'){var y=window.scrollY;draw();window.scrollTo(0,y)}
    else{
      document.querySelectorAll('[data-q="'+id+'"]').forEach(function(el){el.innerHTML=qtyHtml(id)});
      var n=count(),c=$('cnt');c.hidden=!n;c.textContent=n;
      if($('sheet').classList.contains('open'))openSheet(id);
    }
  }
  function openSheet(id){
    var x=byId(id),off=x.o?Math.round((1-x.p/x.o)*100):0;
    $('sh').innerHTML='<div style="position:relative"><div class="pic" style="background:'+x.bg+'">'+x.e+'</div><button class="close" data-a="close" aria-label="Yopish">✕</button></div>'+
      '<div class="bd"><h2>'+x.n+'</h2><div class="rt">⭐ '+x.r+' · '+x.v+' ta sharh</div><p>'+x.d+'</p>'+
      '<div class="pr" style="font-size:22px">'+money(x.p)+(off?' <span class="badge" style="position:static">−'+off+'%</span>':'')+'</div>'+
      (x.o?'<div class="old">'+money(x.o)+'</div>':'')+'<div style="margin-top:10px" data-q="'+id+'">'+qtyHtml(id)+'</div></div>';
    $('sheet').classList.add('open');
  }
  function order(){
    var pf=S.prof,c=calc();
    if(!(pf.name||'').trim()||(pf.phone||'').replace(/\D/g,'').length<9||(deliv==='courier'&&!(pf.address||'').trim())){toast('Ism, telefon'+(deliv==='courier'?' va manzil':'')+'ni to‘ldiring');return}
    var d=new Date(),z=function(n){return ('0'+n).slice(-2)};
    var o={id:Date.now(),date:z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()),status:'Qabul qilindi',deliv:deliv,pay:pay,promo:promo,
      items:Object.keys(cart).map(function(k){return {id:+k,name:byId(k).n,qty:cart[k],price:byId(k).p}}),subtotal:c.sub,discount:c.disc,delivery:c.dl,total:c.sum,name:pf.name,phone:pf.phone,address:deliv==='courier'?pf.address:''};
    S.orders.unshift(o);save2();cart={};promo='';persist();
    if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}}
    if(tg&&tg.sendData){tg.sendData(JSON.stringify(o));return}
    toast('Buyurtma qabul qilindi (sinov rejimi)');tab='orders';draw();window.scrollTo(0,0);
  }

  document.addEventListener('click',function(e){
    var t=e.target,b=t.closest('button'),card=t.closest('[data-open]');
    if(b&&b.dataset.t){tab=b.dataset.t;draw();window.scrollTo(0,0);return}
    if(b&&b.dataset.cat){cat=b.dataset.cat;draw();return}
    if(b&&b.dataset.a==='fav'){e.stopPropagation();var fi=b.dataset.id;if(S.fav[fi])delete S.fav[fi];else S.fav[fi]=1;save2();if(tab==='fav'){draw()}else{document.querySelectorAll('[data-a="fav"][data-id="'+fi+'"]').forEach(function(el){el.textContent=S.fav[fi]?'❤️':'🤍'})}return}
    if(b&&b.dataset.a==='deliv'){deliv=b.dataset.v;redraw();return}
    if(b&&b.dataset.a==='pay'){pay=b.dataset.v;redraw();return}
    if(b&&b.dataset.a==='promo'){var code=$('pc').value.trim().toUpperCase();if(!code){promo=''}else if(PROMOS[code]){promo=code;toast('Promokod qo‘llandi')}else{promo='';toast('Promokod topilmadi')}redraw();return}
    if(b&&b.dataset.a==='repeat'){var o=S.orders.filter(function(x){return x.id==b.dataset.id})[0];if(o){o.items.forEach(function(i){cart[i.id]=(cart[i.id]||0)+i.qty});persist();tab='cart';draw();window.scrollTo(0,0);toast('Savatga qo‘shildi')}return}
    if(b&&b.dataset.a==='inc'){change(b.dataset.id,1);return}
    if(b&&b.dataset.a==='dec'){change(b.dataset.id,-1);return}
    if(b&&b.dataset.a==='order'){order();return}
    if(b&&b.dataset.a==='close'){$('sheet').classList.remove('open');return}
    if(t===$('sheet')){$('sheet').classList.remove('open');return}
    if(card){openSheet(card.dataset.open)}
  });
  $('q').addEventListener('input',function(){q=this.value;if(tab==='home')home()});
  document.addEventListener('input',function(e){var m={nm2:'name',ph:'phone',ad:'address'},k=m[e.target.id];if(k){S.prof[k]=e.target.value;save2()}});
  document.addEventListener('change',function(e){if(e.target.id==='sort'){sortBy=e.target.value;home()}});
  draw();
})();
</script>
</body>
</html>
